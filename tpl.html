<style>
/* Layout: full-bleed map canvas; title top-left, controls docked bottom as a timeline strip, compact legend bottom-right above it. */
:root{
  --sea:#a6d6d4;--sea2:#7dbcbf;--land:#d9d6b8;--border:rgba(70,60,40,.35);--coast:#3d6f73;--shadow:rgba(20,70,72,.3);--halo:rgba(255,255,255,.85);
  --ink:#1f2a30;--soft:#5e6b72;--glass:rgba(247,248,246,.88);--line:rgba(31,42,48,.14);--accent:#d9572b;
  --cloud:255,255,255;--cloudShade:176,188,202;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sea:#10292c;--sea2:#08191b;--land:#2f3229;--border:rgba(230,220,200,.22);--coast:#5aa3a2;--shadow:rgba(0,0,0,.6);--halo:rgba(10,20,24,.8);--ink:#e8ecec;--soft:#9aa7ad;--glass:rgba(20,26,30,.86);--line:rgba(232,236,236,.14);--accent:#f07a4a;--cloud:226,232,238;--cloudShade:120,134,150;color-scheme:dark}}
:root[data-theme="dark"]{--sea:#10292c;--sea2:#08191b;--land:#2f3229;--border:rgba(230,220,200,.22);--coast:#5aa3a2;--shadow:rgba(0,0,0,.6);--halo:rgba(10,20,24,.8);--ink:#e8ecec;--soft:#9aa7ad;--glass:rgba(20,26,30,.86);--line:rgba(232,236,236,.14);--accent:#f07a4a;--cloud:226,232,238;--cloudShade:120,134,150;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--sea);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.head{position:absolute;left:20px;top:calc(16px + env(safe-area-inset-top,0px));max-width:min(380px,calc(100vw - 40px));pointer-events:none}
h1{font-family:var(--display);font-weight:600;font-size:clamp(28px,3.4vw,42px);line-height:.95;letter-spacing:.01em;margin:0;text-transform:uppercase;text-wrap:balance}
.when{font-family:var(--mono);font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.badge{display:inline-block;margin-top:8px;padding:3px 8px;border-radius:4px;background:var(--accent);color:#fff;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.legend{position:absolute;right:20px;bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:10.5px;color:var(--soft);display:grid;gap:5px;width:168px}
.legend .t{color:var(--ink);font-size:11px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
.legend label{display:flex;gap:6px;align-items:center;cursor:pointer}.legend input{margin:0;accent-color:var(--accent)}
.ramp{height:6px;border-radius:2px}
.ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;font-variant-numeric:tabular-nums}
.ticks.abs{display:block;position:relative;height:11px}.ticks.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}.ticks.abs span:first-child{transform:none}.ticks.abs span:last-child{transform:translateX(-100%)}
.dock{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}
#play{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--ink);color:var(--sea);font-size:15px;cursor:pointer;grid-row:span 3}
#play:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=range]{width:100%;margin:0;accent-color:var(--accent)}
.days{position:relative;height:14px;font-family:var(--mono);font-size:10.5px;color:var(--soft)}
.days span{position:absolute;white-space:nowrap;transform:translateX(-50%)}
.days span.d{color:var(--ink);transform:none;padding-left:4px;border-left:1px solid var(--line)}
#gifBtn{position:absolute;right:12px;top:8px;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 11px var(--mono);letter-spacing:.06em;padding:4px 9px;border-radius:5px;cursor:pointer}
#gifBtn:hover,#gifBtn[aria-expanded=true]{background:var(--ink);color:var(--sea)}
#avBtn{position:absolute;right:62px;top:8px;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 11px var(--mono);letter-spacing:.06em;padding:4px 9px;border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:6px}
#avBtn i{width:8px;height:8px;border-radius:2px;background:linear-gradient(90deg,#f2c500 33%,#f08a00 33% 66%,#d6202a 66%)}
#avBtn:hover,#avBtn[aria-pressed=true]{background:var(--ink);color:var(--sea)}
.avleg{display:flex;gap:8px;flex-wrap:wrap;font-size:10.5px;color:var(--ink)}.avleg span{display:flex;align-items:center;gap:4px}.avleg i{width:10px;height:10px;border-radius:2px;border:1.5px solid}
.gifpanel{position:absolute;right:12px;bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:min(300px,calc(100vw - 24px));font-size:12px;display:grid;gap:9px;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.gifpanel h2{font:600 17px var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0}
.gifpanel .row{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:8px}
.gifpanel select{font:12px var(--sans);color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:5px;padding:4px 6px;min-width:0}
.gifpanel .go{font:500 13px var(--sans);background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px;cursor:pointer}.gifpanel .go:disabled{opacity:.6;cursor:progress}
.gifpanel img{max-width:100%;border-radius:6px;border:1px solid var(--line)}
.gifpanel .st{color:var(--soft);font-size:11px;min-height:1em}
#tip{position:absolute;z-index:20;pointer-events:none;display:none;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:12px;padding:11px 13px 10px;font-size:12px;line-height:1.4;width:250px;box-shadow:0 8px 28px rgba(0,0,0,.16)}
#tip .hd b{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.1;display:block;overflow-wrap:anywhere}
#tip .hd small{display:block;color:var(--soft);font-size:11px;margin-top:2px}
#tip .hero{display:flex;align-items:center;gap:10px;margin:8px 0 9px}
#tip .hero .tv{font-family:var(--display);font-weight:600;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#tip .hero .tv sup{font-size:15px;font-weight:500;vertical-align:top;margin-left:1px}
#tip .hero .sky{color:var(--soft);font-size:12px;line-height:1.3}
#tip .hero .sky strong{display:block;color:var(--ink);font-weight:600;font-size:13px}
#tip .stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-top:8px;gap:4px}
#tip .stats div{display:grid;gap:1px}#tip .stats span{color:var(--soft);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
#tip .stats em{font-style:normal;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap}
#tip .stats svg{width:11px;height:11px;vertical-align:-1px;margin-left:3px}
#tip .est{margin-top:7px;font-size:10px;color:var(--soft)}
#tip .ex{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:11.5px}#tip .ex span:first-child{color:var(--soft)}#tip .ex span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
#tip .av{margin-top:8px;padding-top:7px;border-top:1px solid var(--line);display:grid;gap:4px;font-size:11.5px}#tip .av div{display:flex;gap:6px;align-items:baseline}#tip .av i{flex:none;width:9px;height:9px;border-radius:2px;transform:translateY(1px)}
.note{font-size:9.5px;line-height:1.4;color:var(--soft)}
.layers{position:absolute;right:20px;top:calc(18px + env(safe-area-inset-top,0px));display:flex;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.layers button{border:0;background:transparent;color:var(--ink);font:500 12px var(--sans);padding:6px 11px;border-radius:5px;cursor:pointer;white-space:nowrap}
.layers button:hover{background:var(--line)}.layers button[aria-pressed=true]{background:var(--ink);color:var(--sea)}
.layers button:focus-visible,#avBtn:focus-visible,#gifBtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layers .s{display:none}
.accwin{display:flex;gap:3px}.accwin button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 10.5px var(--mono);padding:3px 0;border-radius:4px;cursor:pointer}.accwin button[aria-pressed=true]{background:var(--ink);color:var(--sea)}
/* zoom buttons, also reachable by keyboard */
.zoom{position:absolute;left:20px;top:50%;transform:translateY(-50%);display:grid;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.zoom button{width:34px;height:34px;border:0;background:transparent;color:var(--ink);font:500 18px var(--sans);cursor:pointer}.zoom button+button{border-top:1px solid var(--line)}.zoom button:hover{background:var(--line)}.zoom button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.stale{color:var(--accent)}
.legend #src{display:none}
@media (max-width:640px){
  .head{left:12px}.legend{right:12px;left:auto;top:auto;bottom:calc(116px + env(safe-area-inset-bottom,0px));width:150px;padding:7px 9px}
  .layers{left:12px;right:12px;top:calc(56px + env(safe-area-inset-top,0px));justify-content:space-between}.layers button{padding:6px 8px;flex:1}.layers .l{display:none}.layers .s{display:inline}
  .legend .note{display:none}.legend #avN{display:block}h1{font-size:28px}.when{padding-right:132px}.when .hp{display:none}
  #tip{left:12px!important;right:12px;width:auto;top:calc(110px + env(safe-area-inset-top,0px))!important}
  .zoom{left:12px;top:auto;bottom:calc(128px + env(safe-area-inset-bottom,0px));transform:none}.zoom button{width:42px;height:42px}
  .accwin button{padding:9px 0;font-size:10.5px;white-space:nowrap}.legend #src{display:block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}

<script>
"use strict";
const $=id=>document.getElementById(id);
const GEO=JSON.parse($('geo').textContent),WX=JSON.parse($('wx').textContent);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
// ---- projection: equirectangular around Spain; Canarias scaled into an inset in the Atlantic, west of the Algarve
const LAT0=40.2,KX=Math.cos(LAT0*Math.PI/180),CK=0.6,CX0=-12.4,CY0=35.95,CLON=-18.6,CLAT=27.3;
const isCan=c=>c===35||c===38;
const pj=(lon,lat,can)=>can?[((lon-CLON)*CK+CX0)*KX,(lat-CLAT)*CK+CY0]:[lon*KX,lat];
const BB=[-12.45*KX,35.9,4.4*KX,43.85];
// ---- weather grids
const decode=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
const GR=WX.grids.map(g=>({...g,can:g.id==='can',cloud:decode(g.cloud),rain:decode(g.rain),cv:document.createElement('canvas')}));
// temperature/wind arrive in newer wx.json; wind is turned into u/v (towards which it blows) so it interpolates across north;
// cum = running rain total in mm, so the total between two hours is a subtraction
const HAS={temp:!!WX.grids[0].temp,wind:!!WX.grids[0].ws};
GR.forEach((g,gi)=>{const s=WX.grids[gi],N=g.nx*g.ny*WX.T;
  if(HAS.temp){const b=decode(s.temp);g.temp=new Float32Array(N);for(let i=0;i<N;i++)g.temp[i]=b[i]/3-40;}
  if(HAS.wind){const w=decode(s.ws),d=decode(s.wd);g.u=new Float32Array(N);g.v=new Float32Array(N);g.ws=new Float32Array(N);
    for(let i=0;i<N;i++){const a=d[i]/256*2*Math.PI;g.ws[i]=w[i];g.u[i]=-w[i]*Math.sin(a);g.v[i]=-w[i]*Math.cos(a);}}
  const n=g.nx*g.ny;g.cum=new Float32Array(N);for(let k=0;k<n;k++){let c=0;for(let tt=0;tt<WX.T;tt++){c+=g.rain[tt*n+k]/10;g.cum[tt*n+k]=c;}}});
GR.forEach(g=>{g.cv.width=g.nx;g.cv.height=g.ny;g.ctx=g.cv.getContext('2d');g.img=g.ctx.createImageData(g.nx,g.ny);});
const RSTOPS=[[0.1,[160,210,240,0]],[0.3,[120,190,235,170]],[1,[60,140,220,215]],[2,[40,170,110,225]],[5,[235,200,40,235]],[10,[235,120,30,240]],[20,[200,30,60,245]]];
const ramp=(S,v)=>{if(v<=S[0][0])return S[0][1];for(let i=1;i<S.length;i++){const [a,ca]=S[i-1],[b,cb]=S[i];if(v<=b){const f=(v-a)/(b-a);return ca.map((x,k)=>x+(cb[k]-x)*f);}}return S[S.length-1][1];};
// fixed scale spanning Spain's yearly extremes (−10 °C to 45 °C), so a colour always means the same temperature
const TSTOPS=[[-10,[120,60,170,195]],[-5,[94,79,162,190]],[0,[50,136,189,190]],[5,[102,194,165,185]],[10,[171,221,164,180]],[15,[230,245,152,175]],[20,[254,224,139,180]],[25,[253,174,97,190]],[30,[244,109,67,200]],[35,[213,62,79,210]],[40,[158,1,66,220]],[45,[90,0,40,230]]];
// same colours as the hourly precipitation, stretched to accumulated millimetres
const ASTOPS=[[0.2,[160,210,240,0]],[1,[120,190,235,170]],[3,[60,140,220,215]],[6,[40,170,110,225]],[12,[235,200,40,235]],[25,[235,120,30,240]],[50,[200,30,60,245]]];
// same colours as the particle classes (PCOL), so the background and the particles tell the same story
const WSTOPS=[[5,[42,143,181,0]],[15,[42,143,181,110]],[25,[31,158,138,150]],[35,[63,158,63,175]],[50,[212,165,0,195]],[70,[224,112,28,215]],[90,[200,32,60,230]]];
// lluvia acumulada over a short window that ends at the shown hour
let mode='cielo',accWin=6;const accStart=()=>Math.max(0,t-accWin);
// continuous fields, with the provincial mean written on each province
const PROV_MODES={temp:'temp',acc:'acc'};
// number shown on the map for a temperature (°) or accumulated-rain (mm) value
function fmtVal(v){return mode==='temp'?Math.round(v)+'°':(v<0.2?'0':v<10?v.toFixed(1).replace('.',','):String(Math.round(v)));}
function provMean(p,f){let s=0,n=0;for(const [x,y] of p.samp){const v=valueAt(x,y,t);if(v&&v[f]!=null){s+=v[f];n++;}}return n?s/n:null;}
function rainCol(mm){if(mm<RSTOPS[0][0])return null;for(let i=1;i<RSTOPS.length;i++){const [a,ca]=RSTOPS[i-1],[b,cb]=RSTOPS[i];if(mm<=b){const f=(mm-a)/(b-a);return ca.map((v,k)=>v+(cb[k]-v)*f);}}return RSTOPS[RSTOPS.length-1][1];}
$('rampR').style.background=`linear-gradient(90deg,${RSTOPS.map(([,c],i)=>`rgba(${c[0]},${c[1]},${c[2]},${Math.max(.35,c[3]/255)}) ${i/(RSTOPS.length-1)*100}%`).join(',')})`;
$('rampC').style.background=`linear-gradient(90deg,rgba(${css('--cloud')},0),rgba(${css('--cloud')},.55) 50%,rgba(${css('--cloudShade')},.85))`;$('rampC').style.boxShadow='inset 0 0 0 1px '+css('--line');
// tick labels sit exactly where their colour stop is drawn (stops are evenly spaced in the ramp; colours interpolate linearly between them, as on the map)
function setTicks(el,items){el.innerHTML=items.map(([l,f])=>`<span style="left:${(f*100).toFixed(2)}%">${l}</span>`).join('');}
const dec=v=>String(v).replace('.',',');
setTicks($('ticksR'),RSTOPS.map(([v],i)=>[i===RSTOPS.length-1?'≥'+dec(v):dec(v),i/(RSTOPS.length-1)]));
