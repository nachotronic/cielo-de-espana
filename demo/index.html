<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El Parte · muestra de píldora</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Sample of the video "píldora": a drawn presenter reads a short forecast over the map.
   Voice comes from the browser (speechSynthesis), so it differs per device; the real clip would use a fixed voice. */
:root{--ink:#202d35;--accent:#ee5a2b;--soft:#5e717a;--sea:#8cc4c6;--paper:#f3f1ea;--display:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1b2328;color:var(--ink);font-family:var(--sans)}
body{display:grid;place-items:center;padding:12px}
.frame{position:relative;width:min(100%,calc((100dvh - 24px)*9/16));aspect-ratio:9/16;background:var(--paper);border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.4);container-type:inline-size}
.top{position:absolute;inset:0 0 auto 0;padding:5cqw 6cqw 0;z-index:3}
.lw{font:800 11cqw/.9 var(--display);letter-spacing:-.01em}
.lb{position:relative;height:1.3cqw;border-radius:1cqw;background:var(--ink);margin:1.6cqw 0}.lb i{position:absolute;left:75%;width:15%;top:0;bottom:0;border-radius:1cqw;background:var(--accent)}
.lt{display:flex;justify-content:space-between;font:600 2.6cqw var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.map{position:absolute;left:4cqw;right:4cqw;top:27cqw;height:92cqw;border-radius:3cqw;overflow:hidden;background:var(--sea);z-index:1}
.map img{position:absolute;left:0;top:0;width:100%;height:auto;transform-origin:0 0;transition:transform 1.6s cubic-bezier(.45,0,.2,1),opacity .6s}
.map img.off{opacity:0}
.tag{position:absolute;left:3cqw;top:3cqw;padding:1cqw 2.4cqw;border-radius:1.5cqw;background:var(--ink);color:#fff;font:600 3cqw var(--sans);z-index:2}
.pin{position:absolute;width:5cqw;height:5cqw;margin:-2.5cqw 0 0 -2.5cqw;border-radius:50%;border:.9cqw solid var(--accent);z-index:2;opacity:0;transition:opacity .4s}
.pin.on{opacity:1;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.35)}}
.sub{position:absolute;right:4cqw;bottom:5cqw;left:51cqw;min-height:22cqw;display:flex;align-items:flex-end;z-index:3}
.sub p{margin:0;padding:2.4cqw 3cqw;border-radius:2.4cqw;background:rgba(32,45,53,.92);color:#fff;font:600 3.7cqw/1.35 var(--sans)}
.sub p:empty{display:none}
.bar{position:absolute;left:0;right:0;bottom:0;height:1.4cqw;background:rgba(32,45,53,.15);z-index:4}.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s linear}
.go{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(243,241,234,.55);border:0;cursor:pointer;font:inherit}
.go[hidden]{display:none}.go span{display:grid;place-items:center;width:22cqw;height:22cqw;border-radius:50%;background:var(--ink);color:#fff;font-size:8cqw;padding-left:1.5cqw;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.go small{position:absolute;bottom:42%;transform:translateY(16cqw);font:600 3.4cqw var(--sans);color:var(--ink)}
.note{position:absolute;left:51cqw;right:4cqw;top:121cqw;font:400 2.5cqw var(--sans);color:var(--soft);z-index:1}
/* presenter: framed portrait; one image per mouth shape (Nacho's sheet), swapped in time with the text */
.host{position:absolute;left:4cqw;bottom:5cqw;width:44cqw;aspect-ratio:330/441;border-radius:3cqw;overflow:hidden;background:#d6d7d8;box-shadow:0 2cqw 6cqw rgba(0,0,0,.18);z-index:2;animation:breathe 4.5s ease-in-out infinite;transform-origin:50% 100%}
.host img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 45ms linear}.host img.eye{transition:none}.host img.on{opacity:1}.host img.eye{z-index:1}
@keyframes breathe{50%{transform:scale(1.01)}}
@media (prefers-reduced-motion:reduce){.host,.pin.on{animation:none}.map img{transition:opacity .6s}}
</style>
<div class="frame">
  <div class="top"><div class="lw">EL PARTE</div><div class="lb"><i></i></div><div class="lt"><span>El tiempo, en el mapa</span><span id="day"></span></div></div>
  <div class="map" id="map"><img id="m1" src="map_cielo.jpg" alt=""><img id="m2" class="off" src="map_temp.jpg" alt=""><div class="tag" id="tag">Nubes y lluvia</div><div class="pin" id="pin"></div></div>
  <div class="note">Muestra con datos de un día anterior. En la versión real el guion y el mapa salen de la previsión del momento.</div>
  <div class="host" id="host" role="img" aria-label="Presentadora de El Parte"><img data-v="rest" src="v_rest.webp" alt="" class="on"><img data-v="a" src="v_a.webp" alt=""><img data-v="e" src="v_e.webp" alt=""><img data-v="i" src="v_i.webp" alt=""><img data-v="o" src="v_o.webp" alt=""><img data-v="u" src="v_u.webp" alt=""><img data-v="mbp" src="v_mbp.webp" alt=""><img data-v="fv" src="v_fv.webp" alt=""><img data-v="soft" src="v_soft.webp" alt=""><img data-v="mid" src="v_mid.webp" alt=""><img data-v="round" src="v_round.webp" alt=""><img class="eye" id="eHalf" src="eye_half.webp" alt=""><img class="eye" id="eClosed" src="eye_closed.webp" alt=""></div>
  <div class="sub"><p id="sub"></p></div>
  <div class="bar"><i id="prog"></i></div>
  <button class="go" id="go" aria-label="Reproducir el parte"><span>▶</span><small>Toca para ver el parte</small></button>
</div>
<script>
// map image is 1000×900; each line says what to show: which map, where to zoom (image px), and an optional pin
const SCRIPT=[
  {t:'Buenos días. Esto es El Parte, el tiempo en el mapa.',img:1,z:1,x:500,y:450},
  {t:'Hoy hay chubascos en el centro peninsular: en Madrid pueden caer hasta cinco litros a lo largo del día.',img:1,z:2.4,x:519,y:384,pin:true},
  {t:'También lloverá algo en Córdoba y Málaga, aunque de forma débil.',img:1,z:2.2,x:466,y:625,pin:true},
  {t:'En el norte, cielos tranquilos y sin lluvia, de Galicia a Cataluña.',img:1,z:1.7,x:560,y:230},
  {t:'Las temperaturas, en ascenso: treinta grados en Sevilla y veintiséis en Zaragoza y Valencia.',img:2,z:1.9,x:420,y:560,pin:{x:386,y:616}},
  {t:'Y en Canarias, veinticinco grados con algo de viento. Esto ha sido El Parte. ¡Feliz día!',img:2,z:2.6,x:150,y:700,pin:{x:122,y:688}},
];
const $=id=>document.getElementById(id),map=$('map'),m1=$('m1'),m2=$('m2'),pin=$('pin'),host=$('host');
$('day').textContent=new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'}).format(new Date());
// zoom so image point (x,y) sits in the middle of the map box
function frameTo(s){const W=map.clientWidth,H=map.clientHeight,k=W/1000*s.z;let tx=W/2-s.x*k,ty=H/2-s.y*k;
  tx=Math.min(0,Math.max(W-1000*k,tx));ty=Math.min(0,Math.max(H-900*k,ty));
  for(const im of [m1,m2])im.style.transform=`translate(${tx}px,${ty}px) scale(${k*1000/W})`;
  m1.classList.toggle('off',s.img!==1);m2.classList.toggle('off',s.img!==2);$('tag').textContent=s.img===1?'Nubes y lluvia':'Temperatura máxima';
  const p=s.pin===true?{x:s.x,y:s.y}:s.pin;pin.classList.toggle('on',!!p);if(p){pin.style.left=(tx+p.x*k)+'px';pin.style.top=(ty+p.y*k)+'px';}
  host.classList.toggle('point',!!p);}
// lip sync: each letter becomes a mouth shape with a duration; the timeline runs on its own and jumps to
// the word the voice is on whenever the browser reports a word boundary
const VIS={};host.querySelectorAll('img[data-v]').forEach(im=>VIS[im.dataset.v]=im);let cur='rest';
const show=v=>{if(v===cur)return;VIS[cur].classList.remove('on');VIS[v].classList.add('on');cur=v;};
// letters → mouth shapes; plain consonants use the soft opening, and wide vowels get a half-open step on the
// way in and out (rounded for o/u) so the mouth doesn't jump straight from closed to wide
function timeline(text){const t=text.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');const raw=[],at=[];let ms=0;
  for(let i=0;i<t.length;i++){const c=t[i];at[i]=ms;let v,d;
    if('aeiou'.includes(c)){v=c;d=95;}else if('mbp'.includes(c)){v='mbp';d=70;}else if('fv'.includes(c)){v='fv';d=70;}
    else if(/[sczxj]/.test(c)){v='mid';d=60;}else if(/[a-z]/.test(c)){v='soft';d=50;}else if(/[,;:]/.test(c)){v='rest';d=260;}else if(/[.!?]/.test(c)){v='rest';d=420;}else{v='soft';d=35;}
    raw.push([ms,v,d]);ms+=d;}at[t.length]=ms;
  const CLOSED=new Set(['rest','mbp','fv']),step=v=>v==='o'||v==='u'?'round':'mid',seq=[];
  raw.forEach(([m,v,d],i)=>{const pv=raw[i-1]?.[1]??'rest',nv=raw[i+1]?.[1]??'rest';
    if('aeiou'.includes(v)&&v!=='i'){let a=m,b=m+d;if(CLOSED.has(pv)){seq.push([a,step(v)]);a+=32;}seq.push([a,v]);if(CLOSED.has(nv)&&b-a>50)seq.push([b-28,step(v)]);}
    else seq.push([m,v]);});
  return {seq,at,len:ms};}
let lip=null,lipRaf=0;
function lipRun(text,rate){lip={...timeline(text),t0:performance.now(),rate};cancelAnimationFrame(lipRaf);
  const tick=()=>{if(!lip)return;const el=(performance.now()-lip.t0)*lip.rate;let v='rest';for(const [m,x] of lip.seq){if(m>el)break;v=x;}show(el>lip.len?'rest':v);lipRaf=requestAnimationFrame(tick);};tick();}
function lipSync(ci){if(lip&&lip.at[ci]!=null)lip.t0=performance.now()-lip.at[ci]/lip.rate;}
// blinks: eye patches from the second sheet (aligned to the first) laid over whatever mouth is showing
const eH=$('eHalf'),eC=$('eClosed'),wait=ms=>new Promise(r=>setTimeout(r,ms));
(async function blink(){for(;;){await wait(2200+Math.random()*3800);if(document.hidden)continue;
  eH.classList.add('on');await wait(55);eC.classList.add('on');await wait(95);eC.classList.remove('on');await wait(55);eH.classList.remove('on');
  if(Math.random()<.15){await wait(180);eH.classList.add('on');eC.classList.add('on');await wait(90);eC.classList.remove('on');eH.classList.remove('on');}}})();
function lipStop(){lip=null;cancelAnimationFrame(lipRaf);show('rest');}
const synth=window.speechSynthesis;let voice=null;
function pickVoice(){const vs=synth?synth.getVoices():[];voice=vs.find(v=>/^es[-_]ES/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null;}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice;}
// speak one line; falls back to a timer (no voice on this device) so the clip still plays with subtitles
function say(text){return new Promise(res=>{let done=false;const end=()=>{if(done)return;done=true;lipStop();res();};
  if(synth&&voice){const u=new SpeechSynthesisUtterance(text);u.voice=voice;u.lang=voice.lang;u.rate=1.02;u.onstart=()=>lipRun(text,1.02);u.onboundary=e=>lipSync(e.charIndex);u.onend=end;u.onerror=end;synth.speak(u);
    setTimeout(end,text.length*120+4000);}
  else{lipRun(text,1);setTimeout(end,timeline(text).len+300);}});}
async function play(){$('go').hidden=true;document.querySelector('.note').hidden=true;synth&&synth.cancel();
  for(let i=0;i<SCRIPT.length;i++){const s=SCRIPT[i];frameTo(s);$('sub').textContent=s.t;$('prog').style.width=(i/SCRIPT.length*100)+'%';
    await new Promise(r=>setTimeout(r,500));await say(s.t);await new Promise(r=>setTimeout(r,350));}
  $('prog').style.width='100%';$('sub').textContent='';pin.classList.remove('on');frameTo(SCRIPT[0]);
  $('go').hidden=false;$('go').querySelector('small').textContent='Volver a ver';}
$('go').onclick=play;addEventListener('resize',()=>frameTo(SCRIPT[0]));
frameTo(SCRIPT[0]);
</script>
